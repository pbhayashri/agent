name: Bug Report
description: File a bug report
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
        
        Before continuing, make sure your problem is not already covered by this [FAQ](https://faq.teclib.com/02_FAQ/Agent/).
  - type: dropdown
    id: documentation
    attributes:
      label: Bug reporting acknowledgment
      description: I read the [bug reporting](https://assetsync-agent.readthedocs.io/en/latest/bug-reporting.html) page in [online documentation](https://assetsync-agent.readthedocs.io/en/latest/) before submitting.
      options:
        - Yes, I read it
        - Not applicable
      multiple: true
    validations:
      required: true
  - type: dropdown
    id: professional-support
    attributes:
      label: Professional support
      description: I know I can also request a [professional support](https://services.assetsync-network.com/) to resolv the bug.
      options:
        - Yes, I know
        - I still have but want a public following to keep the community aware
        - I'm a AssetSync partner
        - I would like to be contacted
        - Still not applicable
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: To reproduce
      description: "Steps to reproduce the behavior:"
      placeholder: |
        1.
        2.
        3.
        ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      description: On what operating system AssetSync agent is experimenting this issue ?
      options:
        - Windows
        - Linux
        - MacOSX
        - Other (See additional context below)
      multiple: true
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: AssetSync Agent version
      description: What AssetSync agent version is triggering this issue ?
      options:
        - v1.14
        - v1.13
        - v1.12
        - Nightly build (git version in additional context below)
        - Other (See additional context below)
      multiple: true
    validations:
      required: true
  - type: dropdown
    id: assetsync-version
    attributes:
      label: AssetSync version
      description: What is your AssetSync version on server-side ?
      options:
        - 10.0.18
        - 11.0.0-beta
        - 10.0.17
        - 10.0.16
        - 10.0.x (See additional context below)
        - Other (See additional context below)
        - development release (See additional context below)
        - Not applicable
      multiple: true
    validations:
      required: true
  - type: dropdown
    id: plugin-version
    attributes:
      label: AssetSyncInventory plugin or other plugin version
      description: What is your AssetSyncInventory or FusionInventory for AssetSync plugin version on server-side ?
      options:
        - AssetSync Inventory v1.5.0
        - AssetSync Inventory v1.4.0
        - AssetSync Inventory v1.3.5
        - AssetSync Inventory v1.x.x (See additional context below)
        - FusionInventory for AssetSync (See additional context below)
        - Other (See additional context below)
        - Not applicable
      multiple: true
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      placeholder: Add any other context about the problem here.
    validations:
      required: false
